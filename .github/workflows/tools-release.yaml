name: k8ssandra-client build for external calls
on:
    workflow_dispatch:
        inputs:
            chartName:
                description: 'Name of the chart to be embedded in the image'
                required: true
                type: string
            chartVersion:
                description: 'Target version to upgrade CRDs to. If used with git, give the tag name'
                required: true
                type: string
            repoName:
                description: 'Name of the Helm repository if not default'
                required: false
                type: string
            repoURL:
                description: 'URL of the target repository if repoName is set'
                required: false
                type: string
            gitRepo:
                description: 'git repository to be embedded in the image'
                required: false
                type: string
            chartDir:
                description: 'Directory of the chart in the git repository to be embedded in the image'
                required: false
                type: string
            tokenSecret:
                description: 'Secret name to be used as GitHub token if gitRepo is set'
                required: false
                type: string
            targetDockerRegistry:
                description: 'Target docker registry'
                required: false
                default: 'docker.io'
                type: string
            targetDockerRepo:
                description: 'Target docker repository where images are published'
                required: false
                default: 'k8ssandra'
                type: string
            targetDockerRepoUsername:
                description: 'Target docker repository username'
                required: true
                type: string
            targetDockerRepoPassword:
                description: 'Target docker repository password'
                required: true
                type: string
jobs:
    create_the_images:
      strategy:
        fail-fast: false
        matrix:
          include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
      runs-on: ${{ matrix.runner }}
      env:
        GH_TOKEN: ${{ secrets[inputs.tokenSecret] }}
      steps:
        - name: Check out code into the Go module directory
          uses: actions/checkout@v6
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: Mask registry credentials
          run: |
            echo "::add-mask::${{ inputs.targetDockerRepoUsername }}"
            echo "::add-mask::${{ inputs.targetDockerRepoPassword }}"
        - name: Login to the docker registry
          if: ${{ !env.ACT }}
          uses: docker/login-action@v3
          with:
            registry: ${{ inputs.targetDockerRegistry }}
            username: ${{ inputs.targetDockerRepoUsername }}
            password: ${{ inputs.targetDockerRepoPassword }}
        - name: Docker meta
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: |
              ${{ inputs.targetDockerRegistry }}/${{ inputs.targetDockerRepo }}/k8ssandra-client
            tags: |
              type=raw,value=${{ inputs.chartName }}-${{ inputs.chartVersion }}
        - name: Download the requested charts
          if: ${{ !inputs.gitRepo }}
          id: download_charts
          run: |
            if [ -z "${{ inputs.tokenSecret }}" ]; then
              helm repo add ${{ inputs.repoName }} ${{ inputs.repoURL }}
            else
              helm repo add ${{ inputs.repoName }} ${{ inputs.repoURL }}  --username "${{ env.GH_TOKEN }}" --password "${{ env.GH_TOKEN }}"
            fi
            helm repo update
            helm pull ${{ inputs.repoName }}/${{ inputs.chartName }} --version ${{ inputs.chartVersion }}
            mkdir -p build/${{ inputs.repoName }}
            tar -xvf ${{ inputs.chartName }}-${{ inputs.chartVersion }}.tgz -C build/${{ inputs.repoName }}
        - name: Download the requested chart from another repository
          if: ${{ inputs.gitRepo }}
          id: download_charts_github
          run: |
            gh repo clone ${{ inputs.gitRepo }} ${{ inputs.repoName }}
            cd ${{ inputs.repoName }}
            git checkout ${{ inputs.chartVersion }}
            cd ..
            mkdir -p build/${{ inputs.repoName }}
            cp -R ${{ inputs.repoName }}/${{ inputs.chartDir }}/* build/${{ inputs.repoName }}
            helm dependency update build/${{ inputs.repoName }}
        - name: Prepare Dockerfile requirements
          id: vars
          run: |
            platform=${{ matrix.platform }}
            echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
        - name: Build and push
          id: docker_build
          uses: docker/build-push-action@v6
          with:
            file: cmd/kubectl-k8ssandra/Dockerfile
            platforms: ${{ matrix.platform }}
            context: .
            tags: ${{ inputs.targetDockerRegistry }}/${{ inputs.targetDockerRepo }}/k8ssandra-client
            push: ${{ github.event_name != 'pull_request' }}
            outputs: type=image,push-by-digest=true,name-canonical=true
        - name: Export digest
          run: |
            mkdir -p ${{ runner.temp }}/digests
            digest="${{ steps.docker_build.outputs.digest }}"
            touch "${{ runner.temp }}/digests/${digest#sha256:}"
        - name: Upload digest
          uses: actions/upload-artifact@v5
          with:
            name: digests-${{ env.PLATFORM_PAIR }}
            path: ${{ runner.temp }}/digests/*
            if-no-files-found: error
            retention-days: 1
    merge_the_images:
      runs-on: ubuntu-latest
      needs:
        - create_the_images
      steps:
        - name: Download digests
          uses: actions/download-artifact@v6
          with:
            path: ${{ runner.temp }}/digests
            pattern: digests-*
            merge-multiple: true
        - name: Mask registry credentials
          run: |
            echo "::add-mask::${{ inputs.targetDockerRepoUsername }}"
            echo "::add-mask::${{ inputs.targetDockerRepoPassword }}"
        - name: Login to the docker registry
          if: ${{ !env.ACT }}
          uses: docker/login-action@v3
          with:
            registry: ${{ inputs.targetDockerRegistry }}
            username: ${{ inputs.targetDockerRepoUsername }}
            password: ${{ inputs.targetDockerRepoPassword }}
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: Docker meta
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: |
              ${{ inputs.targetDockerRegistry }}/${{ inputs.targetDockerRepo }}/k8ssandra-client
            tags: |
              type=raw,value=${{ inputs.chartName }}-${{ inputs.chartVersion }}
        - name: Create manifest list and push
          working-directory: ${{ runner.temp }}/digests
          run: |
            docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
              $(printf '${{ inputs.targetDockerRegistry }}/${{ inputs.targetDockerRepo }}/k8ssandra-client@sha256:%s ' *)