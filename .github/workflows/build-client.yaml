name: k8ssandra-client build and deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]
jobs:
  build_and_test:
    name: Unit testing and linting
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # GHA requires longer timeout
          args: --timeout=10m
          # Optional: show only new issues if it's a pull request. The default value is `false`.
          only-new-issues: ${{ github.event_name == 'pull_request' }}
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false
          cache: false
          output-format: json
          output-file: govulncheck.json
      - name: Enforce fixable govulncheck findings
        run: |
          jq -r -s '
            def reachable:
              select(.finding != null)
              | .finding
              | select(any(.trace[]?; (.function // "") != ""));
            [.[] | reachable | select((.fixed_version // "") == "")]
            | unique_by(.osv)[]
            | "::warning title=govulncheck \(.osv)::Reachable vulnerability has no fix available"
          ' govulncheck.json

          if jq -e -s '
            def reachable:
              select(.finding != null)
              | .finding
              | select(any(.trace[]?; (.function // "") != ""));
            any(.[] | reachable; (.fixed_version // "") != "")
          ' govulncheck.json >/dev/null; then
            jq -r -s '
              def reachable:
                select(.finding != null)
                | .finding
                | select(any(.trace[]?; (.function // "") != ""));
              [.[] | reachable | select((.fixed_version // "") != "")]
              | unique_by(.osv)[]
              | "::error title=govulncheck \(.osv)::Reachable vulnerability is fixed in \(.fixed_version)"
            ' govulncheck.json
            exit 1
          fi
      - name: Unit Tests
        run: |
          make test
  build_docker_images:
    name: Build k8ssandra-client Docker Images
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux/amd64
          runner: ubuntu-latest
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            k8ssandra/k8ssandra-client
      - name: Login to DockerHub
        uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare Dockerfile requirements
        id: vars
        run: |
          mkdir -p build/
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Build and push to DockerHub
        id: docker_build_dockerhub
        uses: docker/build-push-action@v7
        with:
          file: cmd/kubectl-k8ssandra/Dockerfile
          platforms: ${{ matrix.platform }}
          context: .
          tags: k8ssandra/k8ssandra-client
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,push-by-digest=true,name-canonical=true
      - name: Build and push to GitHub Container Registry
        id: docker_build_ghcr
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v7
        with:
          file: cmd/kubectl-k8ssandra/Dockerfile
          platforms: ${{ matrix.platform }}
          context: .
          tags: ghcr.io/k8ssandra/k8ssandra-client
          push: true
          outputs: type=image,push-by-digest=true,name-canonical=true
      - name: Export digest
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p "${{ runner.temp }}/digests/dockerhub" "${{ runner.temp }}/digests/ghcr"
          dockerhub_digest="${{ steps.docker_build_dockerhub.outputs.digest }}"
          ghcr_digest="${{ steps.docker_build_ghcr.outputs.digest }}"
          touch "${{ runner.temp }}/digests/dockerhub/${dockerhub_digest#sha256:}"
          touch "${{ runner.temp }}/digests/ghcr/${ghcr_digest#sha256:}"
      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1
  merge:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - build_docker_images
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            k8ssandra/k8ssandra-client
            ghcr.io/k8ssandra/k8ssandra-client
          tags: |
            type=sha,format=short,prefix=
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          for registry in dockerhub ghcr; do
            if [[ "$registry" == dockerhub ]]; then
              image=k8ssandra/k8ssandra-client
            else
              image=ghcr.io/k8ssandra/k8ssandra-client
            fi

            tag_args=()
            while IFS= read -r tag; do
              tag_args+=(-t "$tag")
            done < <(jq -r --arg image "$image" '.tags[] | select(startswith($image + ":"))' <<< "$DOCKER_METADATA_OUTPUT_JSON")

            digest_args=()
            for digest_file in "$registry"/*; do
              digest_args+=("$image@sha256:${digest_file##*/}")
            done
            docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
          done
